
version: 2
models:
  - name: stg_facebook_ads_account_history
    description: Facebook platform account model
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - account_id
            - account_updated_at

  - name: stg_facebook_ads_ad_history
    description: Facebook ads source for identifiers
    columns:
      - name: ad_id
        data_tests:
          - not_null
          - unique

  - name: stg_facebook_ads_ad_set_history
    description: Facebook ad set history
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_group_id
            - ad_group_updated_at

  - name: stg_facebook_ads_basic_all_levels
    description: Facebook daily stats aggregated at the ad level
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_date
            - ad_id
    columns:
      - name: ad_id
        data_tests:
          - not_null

  - name: stg_facebook_ads_campaign_history
    description: Facebook campaign history
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - campaign_id
            - campaign_updated_at