
version: 2
models:
  - name: stg_snapchat_ads_ad_history
    description: Snapchat ads source for identifiers
    columns:
      - name: ad_id
        data_tests:
          - not_null
          - unique

  - name: stg_snapchat_ad_adgroups_history
    description: Snapchat ad groups history
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_group_id
            - ad_group_updated_at

  - name: stg_snapchat_ad_campaigns_history
    description: Snapchat ads campaign history
    columns:
      - name: campaign_id
        data_tests:
          - not_null

  - name: stg_snapchat_ads_stats
    description: Snapchat daily ads stats
    columns:
      - name: ad_id
        data_tests:
          - not_null